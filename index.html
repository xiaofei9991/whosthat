<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="google-site-verification" content="Yz609TqAek0NVdCnfPn2WtSPECxZZGVWILYvHJ-B7QU" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#09090b" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply theme before first paint to avoid a flash. Keep in sync with src/theme.ts:
      // localStorage.theme is 'system' | 'light' | 'dark' (missing = follow system).
      try {
        var t = localStorage.getItem('theme')
        var light =
          t === 'light' ||
          ((t === 'system' || !t) && matchMedia('(prefers-color-scheme: light)').matches)
        if (light) document.documentElement.classList.add('light')
        var m = document.querySelector('meta[name="theme-color"]')
        if (m) m.setAttribute('content', light ? '#fafafa' : '#09090b')
      } catch (e) {}
    </script>
    <title>Who's That? — Spoiler-Free Character Guide for Movies & TV</title>
    <meta
      name="description"
      content="Can't remember who a character is? Get a spoiler-free character guide for any movie or TV show. See who's who, who plays them, and where you've seen the actor before — without ruining the plot."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
