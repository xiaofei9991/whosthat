<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Who's That</title>
  <style>
    :root {
      --bg: #141414;
      --surface: #1f1f1f;
      --text: #e0e0e0;
      --text-secondary: #b0b0b0;
      --accent: #f59e0b;
    }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      width: 320px;
    }
    .container {
      padding: 16px;
      background: var(--surface);
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(245, 158, 11, 0.3);
    }
    h1 {
      margin: 0 0 16px 0;
      font-size: 18px;
      font-weight: 600;
      color: var(--accent);
    }
    .button {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .button:hover {
      background: #fbbf24;
    }
    .status {
      margin-top: 12px;
      font-size: 12px;
      color: var(--text-secondary);
      text-align: center;
    }
    .link {
      color: var(--accent);
      text-decoration: none;
      display: block;
      margin-top: 16px;
      text-align: center;
    }
    .link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Who's That</h1>
    <button class="button" onclick="toggleOverlay()">Toggle Overlay</button>
    <div class="status">Real-time X-Ray • Netflix / Disney+ / HBO</div>
    <a href="https://whosthatcast.com" target="_blank" class="link">Visit whosthatcast.com</a>
  </div>
  <script>
    function toggleOverlay() {
      chrome.runtime.sendMessage({ action: 'toggleOverlay' });
    }
  </script>
</body>
</html>
